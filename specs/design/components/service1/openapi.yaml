openapi: 3.0.3
info:
  title: Service1 API
  version: 0.1.0
  description: Returns the average score of the catalog service2 currently serves.
servers:
  - url: /
paths:
  /average-score:
    get:
      operationId: getAverageScore
      summary: The average score across the current catalog
      responses:
        '200':
          description: The computed average score, as a whole number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AverageScore'
components:
  schemas:
    AverageScore:
      type: object
      required: [average]
      properties:
        average:
          type: integer
          description: Sum of every record's score divided by the number of records, discarding any remainder
