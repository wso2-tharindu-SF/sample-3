openapi: 3.0.3
info:
  title: Service2 API
  version: 0.1.0
  description: Serves the current catalog of scored records and an internal operation to switch its mode.
servers:
  - url: /
paths:
  /catalog:
    get:
      operationId: getCatalog
      summary: The catalog service2 currently serves
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: The current page of the catalog
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count:
                    type: integer
                    description: total records in the current catalog
                  next:
                    type: string
                    nullable: true
                    description: relative URI of the next page
                  previous:
                    type: string
                    nullable: true
                    description: relative URI of the previous page
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Record'
  /catalog-mode:
    put:
      operationId: setCatalogMode
      summary: Switch service2 between full mode and empty mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogMode'
      responses:
        '200':
          description: The mode now in effect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogMode'
components:
  schemas:
    Record:
      type: object
      required: [id, name, score]
      properties:
        id:
          type: integer
          description: record identifier
        name:
          type: string
          description: record name
        score:
          type: integer
          description: record score
    CatalogMode:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [full, empty]
          description: full serves the fixed 10-record catalog; empty serves no records
